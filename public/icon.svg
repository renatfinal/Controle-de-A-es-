<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141A16"/>
      <stop offset="100%" stop-color="#0B0F0C"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#243027" stroke-width="8"/>

  <!-- Subtle glow chart area -->
  <path d="M 64 380 L 160 310 L 256 340 L 352 220 L 448 140 L 448 420 L 64 420 Z" fill="url(#glowGrad)"/>
  <path d="M 64 380 L 160 310 L 256 340 L 352 220 L 448 140" fill="none" stroke="#22C55E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Central RF Badge -->
  <rect x="136" y="116" width="240" height="240" rx="48" fill="url(#greenGrad)" />
  
  <!-- Stylized Monogram RF inside badge -->
  <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="140" font-weight="900" text-anchor="middle" fill="#0B0F0C" letter-spacing="-4">RF</text>

  <!-- Upward Trend Accent dot -->
  <circle cx="448" cy="140" r="16" fill="#86EFAC" stroke="#141A16" stroke-width="4"/>
</svg>
